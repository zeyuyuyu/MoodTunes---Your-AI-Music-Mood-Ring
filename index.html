<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodTunes - Your AI Music Mood Ring</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px #4F46E5; }
            50% { box-shadow: 0 0 20px #4F46E5; }
            100% { box-shadow: 0 0 5px #4F46E5; }
        }
        .mood-ring {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">MoodTunes 🎵</h1>
        
        <div class="max-w-md mx-auto bg-white/10 backdrop-blur-lg rounded-xl p-6 space-y-6">
            <!-- Mood Ring Visualizer -->
            <div class="mood-ring h-48 w-48 mx-auto rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl font-bold"></div>
            
            <!-- Social Share Section -->
            <div class="text-center">
                <p class="text-xl mb-4">Your Mood Today: <span id="moodText" class="font-bold">✨ Dreamy ✨</span></p>
                <button onclick="shareMood()" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-full transition-all transform hover:scale-105">
                    Share My Mood 🚀
                </button>
            </div>

            <!-- Streak Counter -->
            <div class="text-center bg-white/5 rounded-lg p-4">
                <p class="text-sm">🔥 Mood Streak</p>
                <p class="text-3xl font-bold" id="streakCount">7 Days</p>
            </div>

            <!-- Daily Challenge -->
            <div class="bg-white/5 rounded-lg p-4">
                <h3 class="text-center font-bold mb-2">🎯 Daily Challenge</h3>
                <p class="text-sm text-center">Share your mood with 3 friends to unlock today's exclusive playlist!</p>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                    <div class="bg-indigo-600 h-2.5 rounded-full" style="width: 66%"></div>
                </div>
            </div>

            <!-- Friend Activity Feed -->
            <div class="space-y-2">
                <h3 class="font-bold">👥 Friend Activity</h3>
                <div class="bg-white/5 rounded-lg p-3 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-500"></div>
                    <div>
                        <p class="font-bold">Sarah K.</p>
                        <p class="text-sm">Feeling Energetic 🎵</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let streakCount = 7;
        let shareCount = 0;

        function shareMood() {
            shareCount++;
            // Simulate viral sharing mechanics
            const shareText = `🎵 My mood today is ✨Dreamy✨ - Find your music mood at MoodTunes! 🎧`;
            if (navigator.share) {
                navigator.share({
                    title: 'MoodTunes',
                    text: shareText,
                    url: window.location.href
                });
            }

            // Reward animation
            const ring = document.querySelector('.mood-ring');
            ring.style.transform = 'scale(1.1)';
            setTimeout(() => ring.style.transform = 'scale(1)', 200);

            // Update streak if shared
            if (shareCount === 3) {
                streakCount++;
                document.getElementById('streakCount').textContent = `${streakCount} Days`;
                alert('🎉 Congratulations! You've unlocked today\'s exclusive playlist!');
            }
        }

        // Add random mood changes to make the ring feel alive
        setInterval(() => {
            const ring = document.querySelector('.mood-ring');
            const hue = Math.random() * 360;
            ring.style.background = `linear-gradient(45deg, hsl(${hue}, 70%, 50%), hsl(${hue + 60}, 70%, 50%))`;
        }, 3000);
    </script>
</body>
</html>
